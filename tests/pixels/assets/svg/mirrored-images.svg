<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300">
  <!-- Embedded pictures mirrored by their transforms: across, upside down, and mirrored then turned. -->
  <image id="across" x="10" y="10" width="120" height="60" transform="translate(150 0) scale(-1 1)" href="data:image/png;base64,"/>
  <image id="upside-down" x="160" y="10" width="120" height="60" transform="translate(0 90) scale(1 -1)" href="data:image/png;base64,"/>
  <image id="turned" x="300" y="20" width="100" height="50" transform="rotate(30 350 45) translate(700 0) scale(-1 1)" href="data:image/png;base64,"/>
  <image id="both" x="20" y="130" width="160" height="80" transform="matrix(-1 0 0 -1 220 360)" href="data:image/png;base64,"/>
  <image id="turned-down" x="250" y="160" width="120" height="60" transform="rotate(-20 310 190) translate(0 380) scale(1 -1)" href="data:image/png;base64,"/>
</svg>
