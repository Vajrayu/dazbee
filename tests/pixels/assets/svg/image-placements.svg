<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="410" height="310">
  <!-- Embedded pictures placed every way preserveAspectRatio, a transform, opacity and a clip place them. -->
  <defs>
    <clipPath id="circle"><circle cx="55" cy="255" r="40"/></clipPath>
  </defs>
  <image id="meet" x="10" y="10" width="90" height="90" xlink:href="data:image/png;base64,"/>
  <image id="slice" x="110" y="10" width="90" height="90" preserveAspectRatio="xMidYMid slice" href="data:image/png;base64,"/>
  <image id="min-max-meet" x="210" y="10" width="90" height="90" preserveAspectRatio="xMinYMax meet" href="data:image/png;base64,"/>
  <image id="max-min-slice" x="310" y="10" width="90" height="90" preserveAspectRatio="xMaxYMin slice" href="data:image/png;base64,"/>
  <image id="none" x="10" y="110" width="90" height="90" preserveAspectRatio="none" href="data:image/png;base64,"/>
  <g transform="translate(110 110) scale(1.6 1)"><image id="uneven" width="56" height="90" href="data:image/png;base64,"/></g>
  <image id="turned" x="215" y="132" width="80" height="40" transform="rotate(30 255 152)" href="data:image/png;base64,"/>
  <image id="half" x="310" y="110" width="90" height="90" preserveAspectRatio="xMidYMid slice" opacity="0.5" href="data:image/png;base64,"/>
  <image id="clipped" x="10" y="210" width="90" height="90" preserveAspectRatio="xMidYMid slice" clip-path="url(#circle)" href="data:image/png;base64,"/>
  <image id="photo" x="110" y="210" width="90" height="90" href="data:image/jpeg;base64,"/>
</svg>
