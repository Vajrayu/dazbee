<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<!-- Image fills as Figma writes them (fit, crop, a fill stretched unevenly) and a pattern tiling the picture at half its size. -->
<rect id="Fit" x="20" y="20" width="160" height="120" rx="8" fill="url(#fit)"/>
<rect id="Crop" x="220" y="20" width="160" height="120" rx="8" fill="url(#crop)"/>
<rect id="Tiles" x="20" y="160" width="160" height="120" fill="url(#tiles)"/>
<g transform="translate(220 160) scale(1.6 1)"><rect id="Stretched" width="100" height="120" fill="url(#stretched)"/></g>
<defs>
<pattern id="fit" patternContentUnits="objectBoundingBox" width="1" height="1">
<use xlink:href="#photo" transform="matrix(0.00625 0 0 0.00833333 0 0.125)"/>
</pattern>
<pattern id="crop" patternContentUnits="objectBoundingBox" width="1" height="1">
<use xlink:href="#photo" transform="matrix(0.02 0 0 0.02 -0.3 -0.1)"/>
</pattern>
<pattern id="stretched" patternContentUnits="objectBoundingBox" width="1" height="1">
<use xlink:href="#photo" transform="matrix(0.0133333 0 0 0.0111111 -0.566667 0)"/>
</pattern>
<pattern id="tiles" patternUnits="userSpaceOnUse" x="20" y="160" width="80" height="45">
<use xlink:href="#photo" transform="scale(0.5)"/>
</pattern>
<image id="photo" width="160" height="90" xlink:href="data:image/png;base64,"/>
</defs>
</svg>
